<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="P-Type CZ Quartz Crucible placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf9"/><stop offset="1" stop-color="#e7ecea"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e8a57"/><stop offset="1" stop-color="#0a6e45"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12b3a6"/><stop offset="1" stop-color="#0a6e45"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- crucible: cylindrical cup with rounded bottom + flared rim -->
  <g transform="translate(320,172)">
    <ellipse cx="0" cy="118" rx="150" ry="22" fill="#00000010"/>
    <path d="M -120 -70 Q -120 -92 -96 -92 L 96 -92 Q 120 -92 120 -70
             L 112 60 Q 112 118 0 118 Q -112 118 -112 60 Z"
          fill="url(#cup)" stroke="#0a6e45" stroke-width="3"/>
    <!-- translucent inner liner -->
    <path d="M -96 -70 L 92 -70 L 86 54 Q 86 100 0 100 Q -86 100 -86 54 Z"
          fill="#ffffff" fill-opacity="0.16"/>
    <!-- flared rim -->
    <ellipse cx="0" cy="-80" rx="122" ry="20" fill="url(#rim)"/>
    <ellipse cx="0" cy="-80" rx="96" ry="13" fill="#ffffff" fill-opacity="0.22"/>
  </g>
  <text x="320" y="306" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#0b1220">P-Type CZ Quartz Crucible</text>
  <text x="320" y="334" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b6b66">Replace with product photo</text>
</svg>