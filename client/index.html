    <!-- Open Graph Tags -->
    <meta property="og:title" content="Navurja - High-Purity Quartz Crucibles for Solar Ingot Manufacturing" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Navurja",
      "url": "https://www.navurja.com",
      "description": "Manufacturer of high-purity fused quartz crucibles for monocrystalline silicon ingot pulling (Czochralski process)",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN",
        "addressRegion": "India"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Quartz Crucible Products",
        "itemListElement": [
          {
            "@type": "Product",
            "name": "P-Type CZ Quartz Crucibles",
            "description": "Standard fused quartz crucibles (20\"-32\") for P-type monocrystalline silicon ingots, SiO2 >= 99.99%"
          },
          {
            "@type": "Product",
            "name": "N-Type Bubble-Free Crucibles",
            "description": "Synthetic ultra-pure inner-liner crucibles for TOPCon and HJT N-type silicon ingots with extended CZ run life"
          },
          {
            "@type": "Product",
            "name": "G12 Large-Format Crucibles",
            "description": "28\"-40\" quartz crucibles for G12/G12R large-wafer ingot pulling with optional silicon nitride coating"
          }
        ]
      }
    }
    </script>
